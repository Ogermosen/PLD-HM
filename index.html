  <div class="box">

    <img src="./icon-512.png" alt="PLD-HM">

    <h1>PLD-HM</h1>

    <p>
      Acceso al formulario de registro y actualización de información.
    </p>

    <button id="installBtn">
      📲 Instalar PLD-HM
    </button>

    <button id="formBtn">
      📝 Abrir formulario
    </button>

    <div id="iosMessage">
      Para instalar PLD-HM en iPhone:

<script>

  const FORM_URL = "https://forms.gle/TrvjpJDbZHj51Xpy9";

  const installBtn = document.getElementById("installBtn");
  const formBtn = document.getElementById("formBtn");
  const iosMessage = document.getElementById("iosMessage");

  let deferredPrompt = null;

  /* Abrir formulario */
  formBtn.addEventListener("click", function () {
    window.location.href = FORM_URL;
  });

  /* Detectar instalación PWA en Android/Chrome */
  window.addEventListener("beforeinstallprompt", function (event) {

    event.preventDefault();

    deferredPrompt = event;

    installBtn.style.display = "block";

  });

  /* Botón instalar */
  installBtn.addEventListener("click", async function () {

    if (!deferredPrompt) {
      return;
    }

    deferredPrompt.prompt();

    const result = await deferredPrompt.userChoice;

    deferredPrompt = null;

    installBtn.style.display = "none";

  });

  /* Detectar iPhone/iPad */
  const isIOS =
    /iphone|ipad|ipod/i.test(window.navigator.userAgent);

  const isStandalone =
    window.navigator.standalone === true;

  if (isIOS && !isStandalone) {
    iosMessage.style.display = "block";
  }

  /* Registrar Service Worker */
  if ("serviceWorker" in navigator) {

    window.addEventListener("load", function () {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function () {});

    });

  }

</script>
